<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#2563eb" stroke="#1d4ed8" stroke-width="8"/>
  
  <!-- Face outline -->
  <ellipse cx="256" cy="220" rx="80" ry="100" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <circle cx="230" cy="200" r="8" fill="#ffffff"/>
  <circle cx="282" cy="200" r="8" fill="#ffffff"/>
  
  <!-- Nose -->
  <path d="M256 220 L250 235 L262 235 Z" fill="#ffffff"/>
  
  <!-- Mouth -->
  <path d="M240 250 Q256 265 272 250" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Face detection points -->
  <circle cx="200" cy="180" r="3" fill="#10b981"/>
  <circle cx="312" cy="180" r="3" fill="#10b981"/>
  <circle cx="180" cy="220" r="3" fill="#10b981"/>
  <circle cx="332" cy="220" r="3" fill="#10b981"/>
  <circle cx="200" cy="280" r="3" fill="#10b981"/>
  <circle cx="312" cy="280" r="3" fill="#10b981"/>
  
  <!-- Scanning lines -->
  <g opacity="0.7">
    <line x1="150" y1="160" x2="362" y2="160" stroke="#10b981" stroke-width="2"/>
    <line x1="150" y1="200" x2="362" y2="200" stroke="#10b981" stroke-width="2"/>
    <line x1="150" y1="240" x2="362" y2="240" stroke="#10b981" stroke-width="2"/>
    <line x1="150" y1="280" x2="362" y2="280" stroke="#10b981" stroke-width="2"/>
  </g>
  
  <!-- Clock/time indicator -->
  <g transform="translate(380, 380)">
    <circle cx="0" cy="0" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Fingerprint accent -->
  <g transform="translate(130, 380)" opacity="0.8">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>
</svg>