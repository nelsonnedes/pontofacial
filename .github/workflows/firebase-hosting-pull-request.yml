name: Firebase preview release

on:
  pull_request:
    branches: [main]

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    env:
      PONTO_FACIAL_RELEASE_PROFILE: staging
      NEXT_PUBLIC_PONTO_FACIAL_RELEASE_PROFILE: staging
      NEXT_PUBLIC_BIOMETRIC_ENGINE: legacy-client
      NEXT_PUBLIC_BIOMETRIC_LIVENESS_REQUIRED: "true"
      NEXT_PUBLIC_ALLOW_BIOMETRIC_DEMO: "false"
      NEXT_PUBLIC_ALLOW_MANUAL_LIVENESS: "false"
      NEXT_PUBLIC_ALLOW_LEGACY_CLIENT_BIOMETRICS: "true"
      NEXT_PUBLIC_REQUIRED_APP_TERMS_VERSION: 2026-05-24-app-terms-v1
      NEXT_PUBLIC_REQUIRED_PRIVACY_NOTICE_VERSION: 2026-05-24-privacy-notice-v1
      NEXT_PUBLIC_REQUIRED_BIOMETRIC_NOTICE_VERSION: 2026-05-24-biometric-notice-v1
      NEXT_PUBLIC_REQUIRED_LEGAL_CONTENT_HASH: 2026-05-24-legal-baseline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm --filter pwa test

      - name: Firestore rules tests
        run: pnpm test:rules

      - name: Build all
        run: pnpm build:all

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dbponto-facial
          channelId: preview-${{ github.event.pull_request.number }}
          expires: 7d
