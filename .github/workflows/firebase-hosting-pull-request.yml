name: Hospedagem Firebase + Next.js (webframeworks) — preview

on:
  pull_request:
    branches: [main]

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/pwa/package-lock.json

      - name: Print layout (debug)
        run: |
          pwd
          ls -la
          echo "--- apps/pwa ---"
          ls -la apps/pwa || true
          echo "--- firebase.json ---"
          cat firebase.json

      - name: Install deps (apps/pwa)
        run: |
          cd apps/pwa
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Create .env file
        run: |
          cd apps/pwa
          echo "NEXT_PUBLIC_SIGN_CADES_URL=https://placeholder.com/sign/cades" > .env.local
          echo "NEXT_PUBLIC_SIGN_PADES_URL=https://placeholder.com/sign/pades" >> .env.local

      - name: Verify Tailwind CSS setup
        run: |
          cd apps/pwa
          echo "Checking Tailwind CSS configuration..."
          ls -la tailwind.config.* || echo "No tailwind config found"
          ls -la postcss.config.* || echo "No postcss config found"
          ls -la src/app/globals.css || echo "No globals.css found"

      - name: Build (apps/pwa)
        run: |
          cd apps/pwa
          npm run build

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dbponto-facial
          channelId: preview-${{ github.event.pull_request.number }}
          expires: 7d
